name: CI

# core and beacon are published, public modules (github.com/tagwright/core
# v0.2.0, github.com/tagwright/beacon), so a lone checkout of this repo resolves
# every dependency from GitHub and this workflow runs green. GOPRIVATE points go
# at tagwright's own source for direct fetches rather than the public proxy.
# go.sum still verifies integrity.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Fetch tagwright's own modules (core, beacon) directly from source rather
      # than through the public proxy. go.sum still verifies.
      GOPRIVATE: github.com/tagwright/*
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Enforceability layer (Testing Standard, task #552): skip budget,
      # wiring-package coverage floor, deadcode, the docs/TESTING.md gate-check,
      # and the LAST-RUN attestation. All static / go-test-level, so they run
      # here on the hosted leg, not the self-hosted runner (which is reserved for
      # the live integration harness). See test/enforce/README.md.
      - name: Enforceability checks
        run: test/enforce/run-all.sh
