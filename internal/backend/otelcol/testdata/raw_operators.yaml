connectors:
    routing:
        error_mode: ignore
        table:
            - condition: attributes["bilgeline.routing_key"] == "loki"
              context: resource
              pipelines:
                - logs/out_982945308d36
exporters:
    otlphttp/loki:
        endpoint: http://loki:3100/otlp
        headers:
            Authorization: Bearer ${env:LOKI_BEARER}
extensions:
    file_storage:
        create_directory: true
        directory: /var/lib/otelcol/file_storage
    health_check:
        endpoint: 0.0.0.0:13133
processors:
    batch: {}
    memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
    transform/enrich:
        error_mode: ignore
        log_statements:
            - conditions:
                - attributes["container_id"] == "1111111111111111111111111111111111111111111111111111111111111111"
              context: log
              statements:
                - set(resource.attributes["service.name"], "legacy")
                - set(resource.attributes["container.id"], "1111111111111111111111111111111111111111111111111111111111111111")
                - set(resource.attributes["container.name"], "legacy")
                - set(resource.attributes["bilgeline.routing_key"], "loki")
receivers:
    filelog/6ac75fa1ee90:
        include:
            - /var/lib/docker/containers/1111111111111111111111111111111111111111111111111111111111111111/1111111111111111111111111111111111111111111111111111111111111111-json.log
        include_file_path: true
        operators:
            - add_metadata_from_filepath: false
              format: docker
              type: container
            - parse_from: attributes["log.file.path"]
              regex: ^/var/lib/docker/containers/(?P<container_id>[a-f0-9]{64})/
              type: regex_parser
            - field: attributes.source
              type: add
              value: legacy
            - parse_from: body
              regex: ^(?P<pri><\d+>)
              type: regex_parser
        storage: file_storage
service:
    extensions:
        - file_storage
        - health_check
    pipelines:
        logs/ingest:
            exporters:
                - routing
            processors:
                - memory_limiter
                - transform/enrich
            receivers:
                - filelog/6ac75fa1ee90
        logs/out_982945308d36:
            exporters:
                - otlphttp/loki
            processors:
                - batch
            receivers:
                - routing
