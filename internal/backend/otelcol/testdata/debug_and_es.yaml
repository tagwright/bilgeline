connectors:
    routing:
        error_mode: ignore
        table:
            - condition: attributes["bilgeline.routing_key"] == "debug"
              context: resource
              pipelines:
                - logs/out_0b8e9e995d8d
            - condition: attributes["bilgeline.routing_key"] == "es"
              context: resource
              pipelines:
                - logs/out_c0bc1e08f974
exporters:
    debug/debug:
        verbosity: detailed
    elasticsearch/es:
        endpoint: http://es:9200
extensions:
    file_storage:
        create_directory: true
        directory: /var/lib/otelcol/file_storage
    health_check:
        endpoint: 0.0.0.0:13133
processors:
    batch: {}
    memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
    transform/enrich:
        error_mode: ignore
        log_statements:
            - conditions:
                - attributes["container_id"] == "1111111111111111111111111111111111111111111111111111111111111111"
              context: log
              statements:
                - set(resource.attributes["service.name"], "probe")
                - set(resource.attributes["container.id"], "1111111111111111111111111111111111111111111111111111111111111111")
                - set(resource.attributes["container.name"], "probe")
                - set(resource.attributes["bilgeline.routing_key"], "debug")
            - conditions:
                - attributes["container_id"] == "2222222222222222222222222222222222222222222222222222222222222222"
              context: log
              statements:
                - set(resource.attributes["service.name"], "store")
                - set(resource.attributes["container.id"], "2222222222222222222222222222222222222222222222222222222222222222")
                - set(resource.attributes["container.name"], "store")
                - set(resource.attributes["bilgeline.routing_key"], "es")
receivers:
    filelog/8367d617cdee:
        include:
            - /var/lib/docker/containers/1111111111111111111111111111111111111111111111111111111111111111/1111111111111111111111111111111111111111111111111111111111111111-json.log
            - /var/lib/docker/containers/2222222222222222222222222222222222222222222222222222222222222222/2222222222222222222222222222222222222222222222222222222222222222-json.log
        include_file_path: true
        operators:
            - add_metadata_from_filepath: false
              format: docker
              type: container
            - parse_from: attributes["log.file.path"]
              regex: ^/var/lib/docker/containers/(?P<container_id>[a-f0-9]{64})/
              type: regex_parser
        storage: file_storage
service:
    extensions:
        - file_storage
        - health_check
    pipelines:
        logs/ingest:
            exporters:
                - routing
            processors:
                - memory_limiter
                - transform/enrich
            receivers:
                - filelog/8367d617cdee
        logs/out_0b8e9e995d8d:
            exporters:
                - debug/debug
            processors:
                - batch
            receivers:
                - routing
        logs/out_c0bc1e08f974:
            exporters:
                - elasticsearch/es
            processors:
                - batch
            receivers:
                - routing
