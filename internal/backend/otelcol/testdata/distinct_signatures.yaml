connectors:
    routing:
        error_mode: ignore
        table:
            - condition: attributes["bilgeline.routing_key"] == "loki"
              context: resource
              pipelines:
                - logs/out_982945308d36
exporters:
    otlphttp/loki:
        endpoint: http://loki:3100/otlp
        headers:
            Authorization: Bearer ${env:LOKI_BEARER}
extensions:
    file_storage:
        create_directory: true
        directory: /var/lib/otelcol/file_storage
    health_check:
        endpoint: 0.0.0.0:13133
processors:
    batch: {}
    memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
    transform/enrich:
        error_mode: ignore
        log_statements:
            - conditions:
                - attributes["container_id"] == "1111111111111111111111111111111111111111111111111111111111111111"
              context: log
              statements:
                - set(resource.attributes["service.name"], "j")
                - set(resource.attributes["container.id"], "1111111111111111111111111111111111111111111111111111111111111111")
                - set(resource.attributes["container.name"], "j")
                - set(resource.attributes["bilgeline.routing_key"], "loki")
            - conditions:
                - attributes["container_id"] == "2222222222222222222222222222222222222222222222222222222222222222"
              context: log
              statements:
                - set(resource.attributes["service.name"], "l")
                - set(resource.attributes["container.id"], "2222222222222222222222222222222222222222222222222222222222222222")
                - set(resource.attributes["container.name"], "l")
                - set(resource.attributes["bilgeline.routing_key"], "loki")
receivers:
    filelog/854f5d2e3ea4:
        include:
            - /var/lib/docker/containers/2222222222222222222222222222222222222222222222222222222222222222/2222222222222222222222222222222222222222222222222222222222222222-json.log
        include_file_path: true
        operators:
            - add_metadata_from_filepath: false
              format: docker
              type: container
            - parse_from: attributes["log.file.path"]
              regex: ^/var/lib/docker/containers/(?P<container_id>[a-f0-9]{64})/
              type: regex_parser
            - delimiter: =
              pair_delimiter: ' '
              parse_from: body
              type: key_value_parser
            - if: attributes["level"] != nil
              parse_from: attributes.level
              type: severity_parser
            - if: attributes["severity"] != nil
              parse_from: attributes.severity
              type: severity_parser
            - if: attributes["lvl"] != nil
              parse_from: attributes.lvl
              type: severity_parser
        storage: file_storage
    filelog/ec8891c2de79:
        include:
            - /var/lib/docker/containers/1111111111111111111111111111111111111111111111111111111111111111/1111111111111111111111111111111111111111111111111111111111111111-json.log
        include_file_path: true
        operators:
            - add_metadata_from_filepath: false
              format: docker
              type: container
            - parse_from: attributes["log.file.path"]
              regex: ^/var/lib/docker/containers/(?P<container_id>[a-f0-9]{64})/
              type: regex_parser
            - parse_from: body
              parse_to: attributes
              type: json_parser
            - if: attributes["level"] != nil
              parse_from: attributes.level
              type: severity_parser
            - if: attributes["severity"] != nil
              parse_from: attributes.severity
              type: severity_parser
            - if: attributes["lvl"] != nil
              parse_from: attributes.lvl
              type: severity_parser
        storage: file_storage
service:
    extensions:
        - file_storage
        - health_check
    pipelines:
        logs/ingest:
            exporters:
                - routing
            processors:
                - memory_limiter
                - transform/enrich
            receivers:
                - filelog/854f5d2e3ea4
                - filelog/ec8891c2de79
        logs/out_982945308d36:
            exporters:
                - otlphttp/loki
            processors:
                - batch
            receivers:
                - routing
